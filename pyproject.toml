[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "annosennustetavuusmalli"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "loguru>=0.7.3",
    "matplotlib>=3.10.6",
    "mlflow>=3.8.1",
    "numpy>=2.2.6",
    "pydicom>=3.0.1",
    "pyyaml>=6.0.2",
    "rt-utils>=1.2.7",
    "scipy>=1.16.2",
    "simpleitk>=2.4.0",
    "torch>=2.9.0",
    "torchio>=0.21.0",
    "torchvision>=0.24.0",
    "tqdm>=4.67.1",
]

[tool.uv.workspace]
members = [
    ".",
]

[tool.uv.sources]
annosennustetavuusmalli = { workspace = true }

[dependency-groups]
dev = [
    "annosennustetavuusmalli",
]
